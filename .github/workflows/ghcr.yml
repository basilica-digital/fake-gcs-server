name: ghcr

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "*-maypop.*"

permissions:
  contents: read
  packages: write

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: setup qemu
        uses: docker/setup-qemu-action@v3

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        run: |
          image=ghcr.io/basilica-digital/fake-gcs-server
          sha12="${GITHUB_SHA:0:12}"
          tags="${image}:sha-${sha12}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${image}:main"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}

      # GITHUB_TOKEN cannot change package visibility (API 404). The
      # basilica-digital/fake-gcs-server container package must be public so
      # anonymous `docker pull` / `podman pull` works. Set it once in GitHub:
      # Packages → fake-gcs-server → Package settings → Change visibility → Public.
      # Do not mark this job failed on a visibility call the token cannot make.
